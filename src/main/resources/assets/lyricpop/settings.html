<style>
:root {
  --ui-font: "Outfit", system-ui, sans-serif;
  --red: #E4000F;
  --purple: #6A1BCB;
  --red-line: #FF2D40;
  --purple-line: #9150FF;
  --line: linear-gradient(135deg, var(--red-line), var(--purple-line));
  --fill: linear-gradient(135deg, var(--red), var(--purple));
  --dim: rgba(255, 255, 255, 0.74);
  --rule: rgba(145, 80, 255, 0.3);
}
* { box-sizing: border-box; }
html { background: #000; color-scheme: dark; }
body {
  margin: 0;
  min-height: 100vh;
  background: #000;
  color: #fff;
  font: 400 16px/1.45 var(--ui-font);
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(60% 45% at 6% 0%, rgba(228, 0, 15, 0.16), transparent 70%),
    radial-gradient(60% 45% at 100% 100%, rgba(106, 27, 203, 0.2), transparent 70%);
}
button { font: inherit; color: #fff; }
:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

.app { position: relative; max-width: 800px; margin: 0 auto; padding: 32px 20px 72px; }

.top { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 14px; }
.brand img { width: 56px; height: 56px; mix-blend-mode: screen; }
h1 { margin: 0; font-size: 30px; font-weight: 600; line-height: 1.1; letter-spacing: -0.01em; }
.brand p { margin: 2px 0 0; color: var(--dim); font-size: 14px; }

.status { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: rgba(255, 255, 255, 0.5); }
.status[data-state="online"] .dot { background: var(--purple-line); box-shadow: 0 0 10px var(--purple-line); }
.status[data-state="offline"] .dot { background: var(--red-line); box-shadow: 0 0 10px var(--red-line); }
.status button { display: none; padding: 4px 14px; font-size: 13.5px; }
.status[data-state="offline"] button { display: inline-block; }

.btn {
  font-weight: 600;
  border-radius: 99px;
  padding: 10px 24px;
  cursor: pointer;
  border: 2px solid var(--purple-line);
  background: transparent;
  transition: background 0.15s, filter 0.15s;
}
.btn:hover { background: rgba(145, 80, 255, 0.2); }
.btn.primary { border-color: transparent; background: var(--fill); }
.btn.primary:hover { filter: brightness(1.18); }
.btn:disabled { opacity: 0.38; cursor: not-allowed; filter: none; }
.btn:disabled:hover { background: transparent; }
.btn.primary:disabled:hover { background: var(--fill); }

.tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 28px 0 18px; }
.tab {
  padding: 8px 20px;
  font-size: 15px;
  font-weight: 500;
  border-radius: 99px;
  border: 2px solid rgba(145, 80, 255, 0.55);
  background: #000;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
}
.tab:hover { border-color: var(--purple-line); }
.tab[aria-selected="true"] {
  border-color: transparent;
  background: var(--fill);
  font-weight: 600;
  box-shadow: 0 0 22px rgba(228, 0, 15, 0.3);
}

.bubble {
  border: 2px solid transparent;
  border-radius: 36px 36px 8px 36px;
  background: linear-gradient(#000, #000) padding-box, var(--line) border-box;
  padding: 6px 32px 26px;
  box-shadow: -8px -8px 48px rgba(228, 0, 15, 0.14), 8px 8px 48px rgba(106, 27, 203, 0.22);
}

.row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 8px 28px;
  padding: 16px 0;
  border-bottom: 1px solid var(--rule);
}
.row.actions { display: flex; flex-wrap: wrap; gap: 10px; border-bottom: 0; padding-top: 22px; }
.label { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.name { font-size: 16px; font-weight: 500; }
.hint { font-size: 13.5px; color: var(--dim); }
.hint:empty { display: none; }

.switch {
  position: relative;
  width: 52px;
  height: 30px;
  padding: 0;
  border-radius: 99px;
  border: 2px solid var(--purple-line);
  background: #000;
  cursor: pointer;
  transition: background 0.2s, border-color 0.2s;
}
.switch::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 3px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: #fff;
  transition: transform 0.2s;
}
.switch[aria-checked="true"] { background: var(--fill); border-color: transparent; }
.switch[aria-checked="true"]::after { transform: translateX(22px); }

.seg {
  display: inline-flex;
  flex-wrap: wrap;
  gap: 2px;
  padding: 3px;
  border: 2px solid var(--purple-line);
  border-radius: 99px;
}
.seg button {
  padding: 6px 15px;
  font-size: 14.5px;
  border: 0;
  border-radius: 99px;
  background: transparent;
  cursor: pointer;
  transition: background 0.15s;
}
.seg button:hover { background: rgba(255, 255, 255, 0.12); }
.seg button[aria-pressed="true"] { background: var(--fill); font-weight: 600; }
.seg.grid { display: grid; grid-template-columns: 1fr 1fr; border-radius: 22px; }

.swatches { display: flex; flex-wrap: wrap; gap: 9px; justify-content: flex-end; max-width: 300px; }
.swatch {
  width: 28px;
  height: 28px;
  padding: 0;
  border-radius: 50%;
  border: 2px solid #000;
  cursor: pointer;
  transition: box-shadow 0.15s, transform 0.15s;
}
.swatch:hover { transform: scale(1.12); }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px #fff; }

.sl { display: grid; grid-template-columns: 260px 96px; align-items: center; gap: 14px; }
output { text-align: right; font-weight: 500; font-variant-numeric: tabular-nums; }
input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 24px;
  margin: 0;
  background: transparent;
  cursor: pointer;
}
input[type="range"]:focus-visible { border-radius: 99px; }
input[type="range"]::-webkit-slider-runnable-track {
  height: 6px;
  border-radius: 99px;
  background: linear-gradient(90deg, var(--red-line), var(--purple-line)) left center / var(--p, 0%) 100% no-repeat, rgba(255, 255, 255, 0.22);
}
input[type="range"]::-moz-range-track {
  height: 6px;
  border-radius: 99px;
  background: linear-gradient(90deg, var(--red-line), var(--purple-line)) left center / var(--p, 0%) 100% no-repeat, rgba(255, 255, 255, 0.22);
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 20px;
  height: 20px;
  margin-top: -7px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 0 0 3px #000, 0 0 0 5px var(--purple-line), 0 0 14px rgba(145, 80, 255, 0.7);
}
input[type="range"]::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 0;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 0 0 3px #000, 0 0 0 5px var(--purple-line), 0 0 14px rgba(145, 80, 255, 0.7);
}

.foot {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
  margin-top: 8px;
  padding-top: 22px;
  border-top: 1px solid var(--rule);
}
.foot .right { display: flex; align-items: center; gap: 16px; }
.unsaved { font-size: 14px; color: var(--dim); }
.unsaved[hidden] { display: none; }

.toast {
  position: fixed;
  left: 50%;
  bottom: 28px;
  transform: translate(-50%, 16px);
  padding: 10px 22px;
  border: 2px solid var(--purple-line);
  border-radius: 99px;
  background: #000;
  font-weight: 500;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s, transform 0.2s;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.error { border-color: var(--red-line); }

.fontctl { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; align-items: center; max-width: 430px; padding: 4px; border-radius: 14px; }
.fontctl.drop { outline: 2px dashed var(--purple-line); outline-offset: 2px; background: rgba(145, 80, 255, 0.12); }
.fontsel { font: inherit; color: #fff; background: #000; border: 2px solid var(--purple-line); border-radius: 99px; padding: 7px 14px; min-width: 190px; max-width: 100%; cursor: pointer; }
.fontctl .btn { padding: 6px 16px; font-size: 14.5px; }

@media (max-width: 640px) {
  .fontctl { justify-content: flex-start; max-width: none; }
  .bubble { padding: 2px 18px 22px; border-radius: 28px 28px 8px 28px; }
  .row { grid-template-columns: 1fr; }
  .sl { grid-template-columns: 1fr 84px; }
  .swatches { justify-content: flex-start; max-width: none; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>

<script>
const API = "http://localhost:28765/api/config";

const DEFAULTS = {
  enabled: true, showBar: true, showPill: false, showNextLine: true, showProgress: true,
  barAtBottom: false, uiScale: 0.6, uiOpacity: 50, pillWidth: 300, accent: "RAINBOW",
  popups: true, mode: "SCREEN", style: "WORD", popupColor: "LAVENDER", popupScale: 1,
  popupLifetime: 1800, maxPopups: 14, tilt: 12, drift: 1, popupShadow: true,
  screenLayout: "PANEL", panelCorner: "TOP_LEFT", panelLines: 6, panelPast: 0, panelScale: 0.7,
  panelWidth: 150, panelMarginX: 2, panelMarginY: 200,
  panelActive: "RAINBOW", panelInactive: "WHITE", panelBold: false, panelWordFill: false,
  panelShadow: true, panelBackground: 50,
  worldDistance: 5, worldSpread: 4, worldHeight: 0.5, worldScale: 1, lockToWorld: true, seeThrough: false,
  syncOffset: 200, censorLyrics: true, fontFile: ""
};

const THEMES = [
  ["LAVENDER", "Lavender", "#B9A8FF"], ["PINK", "Pink", "#FF9ED8"], ["CYAN", "Cyan", "#7FE7FF"],
  ["MINT", "Mint", "#8CF2B0"], ["GOLD", "Gold", "#FFD76A"], ["WHITE", "White", "#FFFFFF"],
  ["GRAY", "Gray", "#9A9A9A"], ["RED", "Red", "#FF6B6B"], ["RAINBOW", "Rainbow", null]
];
const RAINBOW = "conic-gradient(#ff4d4d, #ffd24d, #7dff7d, #4dd2ff, #7d4dff, #ff4dd2, #ff4d4d)";

const slider = (k, l, min, max, step, unit, extra = {}) => ({ t: "slider", k, l, min, max, step, unit, ...extra });
const toggle = (k, l, h) => ({ t: "toggle", k, l, h });
const theme = (k, l) => ({ t: "theme", k, l });
const choice = (k, l, o, extra = {}) => ({ t: "choice", k, l, o, ...extra });

const TABS = [
  { id: "display", name: "Display", items: [
    toggle("enabled", "Lyrics"),
    toggle("showBar", "Song bar"),
    toggle("showPill", "Lyric pill"),
    toggle("showNextLine", "Next line"),
    toggle("showProgress", "Progress line"),
    toggle("censorLyrics", "Censor lyrics", "Swaps curse words for their first and last letters"),
    choice("barAtBottom", "Position", [[false, "Top"], [true, "Bottom"]]),
    slider("uiScale", "UI size", 0.5, 2, 0.1, "x"),
    slider("uiOpacity", "Opacity", 10, 100, 5, "%", { int: true }),
    slider("pillWidth", "Pill width", 150, 500, 10, "", { int: true }),
    theme("accent", "Accent")
  ]},
  { id: "popups", name: "Popups", items: [
    toggle("popups", "Popup lyrics"),
    choice("mode", "Show", [["SCREEN", "On screen"], ["WORLD", "In the world"], ["BOTH", "Both"]]),
    choice("style", "Style", [["WORD", "Word by word"], ["LINE", "Full line"]]),
    theme("popupColor", "Color"),
    slider("popupScale", "Size", 0.5, 3, 0.1, "x"),
    slider("popupLifetime", "Lifetime", 800, 5000, 100, " ms", { int: true }),
    slider("maxPopups", "Max at once", 3, 30, 1, "", { int: true }),
    slider("tilt", "Tilt", 0, 45, 1, "°", { int: true }),
    slider("drift", "Float speed", 0, 3, 0.1, "x"),
    toggle("popupShadow", "Text shadow")
  ]},
  { id: "screen", name: "Screen", items: [
    choice("screenLayout", "Layout", [["PANEL", "Spotify style"], ["FLOATING", "Floating words"]]),
    choice("panelCorner", "Corner", [["TOP_LEFT", "Top left"], ["TOP_RIGHT", "Top right"], ["BOTTOM_LEFT", "Bottom left"], ["BOTTOM_RIGHT", "Bottom right"]], { grid: true }),
    slider("panelLines", "Lines shown", 3, 11, 1, "", { int: true }),
    slider("panelPast", "Past lines", 0, 3, 1, "", { int: true }),
    slider("panelScale", "Text size", 0.6, 3, 0.1, "x"),
    slider("panelWidth", "Width", 100, 400, 10, "", { int: true }),
    slider("panelMarginX", "Edge gap", 0, 200, 2, "", { int: true }),
    slider("panelMarginY", "Top/bottom gap", 0, 200, 2, "", { int: true })
  ]},
  { id: "style", name: "Style", items: [
    theme("panelActive", "Current line"),
    theme("panelInactive", "Other lines"),
    toggle("panelBold", "Bold text"),
    toggle("panelWordFill", "Word fill"),
    toggle("panelShadow", "Text shadow"),
    slider("panelBackground", "Background", 0, 100, 5, "%", { int: true }),
    { t: "font", k: "fontFile", l: "In-game font", h: "Upload a .ttf or .otf, or drop one here. It is used in game and on this page" },
    { t: "webfont", l: "Website font", h: "The font this page uses. Falls back to the normal font" }
  ]},
  { id: "world", name: "World", items: [
    slider("worldDistance", "Distance", 2, 15, 0.5, " blocks"),
    slider("worldSpread", "Spread", 0, 12, 0.5, " blocks"),
    slider("worldHeight", "Height", -3, 4, 0.25, " blocks"),
    slider("worldScale", "Size", 0.3, 3, 0.1, "x"),
    toggle("lockToWorld", "Stay in world"),
    toggle("seeThrough", "Through walls")
  ]},
  { id: "sync", name: "Sync", items: [
    slider("syncOffset", "Timing offset", -3000, 3000, 50, " ms", { int: true, h: "Positive numbers show lyrics earlier" }),
    { t: "actions", a: [
      ["Reset offset", () => { cfg.syncOffset = 200; }],
      ["Lyrics earlier +100", () => { cfg.syncOffset = Math.min(3000, cfg.syncOffset + 100); }],
      ["Lyrics later −100", () => { cfg.syncOffset = Math.max(-3000, cfg.syncOffset - 100); }]
    ]}
  ]}
];

const h = (tag, props = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) e.setAttribute(k, v);
  for (const c of kids.flat()) e.append(c);
  return e;
};

const $ = id => document.getElementById(id);
const panel = $("panel");
const tabsEl = $("tabs");
const saveBtn = $("save");

let cfg = { ...DEFAULTS };
let saved = JSON.stringify(cfg);
let online = false;
let current = TABS[0].id;
const syncers = [];

function change() {
  syncers.forEach(fn => fn());
  updateFooter();
}

function updateFooter() {
  const dirty = JSON.stringify(cfg) !== saved;
  $("unsaved").hidden = !dirty;
  saveBtn.disabled = !dirty || !online;
}

function buildToggle(it) {
  const b = h("button", { type: "button", class: "switch", role: "switch", "aria-label": it.l });
  b.addEventListener("click", () => { cfg[it.k] = !cfg[it.k]; change(); });
  syncers.push(() => b.setAttribute("aria-checked", String(!!cfg[it.k])));
  return b;
}

function buildChoice(it) {
  const wrap = h("div", { class: "seg" + (it.grid ? " grid" : ""), role: "group", "aria-label": it.l });
  const btns = it.o.map(([v, t]) => {
    const b = h("button", { type: "button" }, t);
    b.addEventListener("click", () => { cfg[it.k] = v; change(); });
    wrap.append(b);
    return [v, b];
  });
  syncers.push(() => btns.forEach(([v, b]) => b.setAttribute("aria-pressed", String(cfg[it.k] === v))));
  return wrap;
}

function buildTheme(it, hint) {
  const wrap = h("div", { class: "swatches", role: "group", "aria-label": it.l });
  const btns = THEMES.map(([v, n, c]) => {
    const b = h("button", { type: "button", class: "swatch", title: n, "aria-label": n });
    b.style.background = c || RAINBOW;
    b.addEventListener("click", () => { cfg[it.k] = v; change(); });
    wrap.append(b);
    return [v, n, b];
  });
  syncers.push(() => btns.forEach(([v, n, b]) => {
    const on = cfg[it.k] === v;
    b.setAttribute("aria-pressed", String(on));
    if (on) hint.textContent = n;
  }));
  return wrap;
}

function buildSlider(it) {
  const dec = it.int ? 0 : (String(it.step).split(".")[1] || "").length;
  const input = h("input", { type: "range", min: it.min, max: it.max, step: it.step, "aria-label": it.l });
  const out = h("output");
  input.addEventListener("input", () => {
    const v = Number(input.value);
    cfg[it.k] = it.int ? Math.round(v) : Number(v.toFixed(dec));
    change();
  });
  syncers.push(() => {
    const v = Number(cfg[it.k]);
    input.value = v;
    input.style.setProperty("--p", ((v - it.min) / (it.max - it.min)) * 100 + "%");
    out.textContent = v.toFixed(dec) + it.unit;
  });
  return h("div", { class: "sl" }, input, out);
}

const FONTS_API = "/api/fonts";
let fonts = [];

const WEB_KEY = "lyricpop.webFont";
let webFont = "";     // font file the page is using ("" = the normal Outfit font)
let webFace = null;

function storedWebFont() { try { return localStorage.getItem(WEB_KEY) || ""; } catch (e) { return ""; } }
function storeWebFont(v) {
  try { if (v) localStorage.setItem(WEB_KEY, v); else localStorage.removeItem(WEB_KEY); } catch (e) { /* private mode */ }
}

// Makes every piece of text on this page use the uploaded font. Letters the font doesn't have fall back to Outfit.
async function applyWebFont(file, quiet) {
  const root = document.documentElement;
  if (webFace) { try { document.fonts.delete(webFace); } catch (e) { /* ignore */ } webFace = null; }
  if (!file) {
    root.style.removeProperty("--ui-font");
    webFont = "";
    storeWebFont("");
    return true;
  }
  try {
    const face = new FontFace("LyricPopCustom", 'url("' + FONTS_API + "/file?name=" + encodeURIComponent(file) + "&t=" + Date.now() + '")');
    await face.load();
    document.fonts.add(face);
    webFace = face;
    root.style.setProperty("--ui-font", '"LyricPopCustom", "Outfit", system-ui, sans-serif');
    webFont = file;
    storeWebFont(file);
    return true;
  } catch (e) {
    root.style.removeProperty("--ui-font");
    webFont = "";
    storeWebFont("");
    if (!quiet) toast("Couldn’t use that font on this page", true);
    return false;
  }
}

async function resetWebFont() {
  await applyWebFont("", true);
  change();
  toast("Website font reset");
}

// Resets only the in-game font. Sends just this one setting so any other unsaved changes stay untouched.
async function resetGameFont() {
  try {
    const r = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ fontFile: "" }) });
    if (!r.ok) throw new Error("HTTP " + r.status);
    setFontSaved("");
    toast("In-game font reset to Minecraft’s font");
  } catch (e) {
    toast("Couldn’t reach the mod. Check that Minecraft is running.", true);
  }
}

function buildWebFont(it) {
  const sel = h("select", { class: "fontsel", "aria-label": it.l }, h("option", { value: "" }, "Normal font"));
  fonts.forEach(f => sel.append(h("option", { value: f.file }, f.name)));
  sel.addEventListener("change", async () => { await applyWebFont(sel.value); change(); });
  const reset = h("button", { type: "button", class: "btn" }, "Reset website font");
  reset.addEventListener("click", resetWebFont);
  syncers.push(() => {
    sel.value = webFont || "";
    reset.disabled = !webFont;
  });
  return h("div", { class: "fontctl" }, sel, reset);
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

async function loadFonts() {
  try {
    const r = await fetch(FONTS_API, { headers: { Accept: "application/json" } });
    fonts = r.ok ? (await r.json()).fonts : [];
  } catch (e) {
    fonts = [];
  }
  if (current === "style") renderTab();
}

// Set the font in the page without marking it as an unsaved change (the mod already saved it).
function setFontSaved(file) {
  cfg.fontFile = file;
  const s = JSON.parse(saved);
  s.fontFile = file;
  saved = JSON.stringify(s);
  change();
}

async function waitForFont(file) {
  for (let i = 0; i < 60; i++) {
    await sleep(1000);
    try {
      const r = await fetch(API, { headers: { Accept: "application/json" } });
      if (r.ok && (await r.json()).fontFile === file) return true;
    } catch (e) { /* keep waiting */ }
  }
  return false;
}

async function uploadFont(f) {
  if (!/\.(ttf|otf)$/i.test(f.name)) { toast("Pick a .ttf or .otf font file", true); return; }
  if (f.size > 10 * 1024 * 1024) { toast("That font is over 10 MB", true); return; }
  toast("Uploading " + f.name + "…");
  try {
    const r = await fetch(FONTS_API + "?name=" + encodeURIComponent(f.name), {
      method: "POST",
      headers: { "X-LyricPop": "1", "Content-Type": "application/octet-stream" },
      body: f
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || "HTTP " + r.status);
    await applyWebFont(j.file);
    change();
    toast("Font added. This page uses it now; Minecraft is reloading, give it a few seconds…");
    const ready = await waitForFont(j.file);
    await loadFonts();
    if (ready) { setFontSaved(j.file); toast("Now using " + j.file + " in game and on this page"); }
    else toast("Font added, but Minecraft hasn’t finished reloading yet.", true);
  } catch (e) {
    toast("Couldn’t add that font: " + e.message, true);
  }
}

async function removeFont(file) {
  if (!file || !confirm("Remove " + file + " from your fonts folder?")) return;
  try {
    const r = await fetch(FONTS_API + "?name=" + encodeURIComponent(file), { method: "DELETE", headers: { "X-LyricPop": "1" } });
    if (!r.ok) throw new Error("HTTP " + r.status);
    if (webFont === file) await applyWebFont("", true);
    setFontSaved("");
    toast("Font removed. Minecraft is reloading…");
    await loadFonts();
  } catch (e) {
    toast("Couldn’t remove that font", true);
  }
}

async function openFontFolder() {
  try {
    const r = await fetch(FONTS_API + "/open", { method: "POST", headers: { "X-LyricPop": "1" } });
    if (!r.ok) throw new Error("HTTP " + r.status);
  } catch (e) {
    toast("Couldn’t open the folder. It’s config/lyricpop/fonts in your Minecraft folder.", true);
  }
}

function buildFont(it) {
  const sel = h("select", { class: "fontsel", "aria-label": it.l }, h("option", { value: "" }, "Minecraft default"));
  fonts.forEach(f => sel.append(h("option", { value: f.file }, f.name)));
  sel.addEventListener("change", () => { cfg[it.k] = sel.value; change(); });

  const picker = h("input", { type: "file", accept: ".ttf,.otf", hidden: "" });
  picker.addEventListener("change", async () => {
    const f = picker.files[0];
    picker.value = "";
    if (f) await uploadFont(f);
  });
  const up = h("button", { type: "button", class: "btn" }, "Upload font");
  up.addEventListener("click", () => picker.click());
  const del = h("button", { type: "button", class: "btn" }, "Remove file");
  del.addEventListener("click", () => removeFont(cfg[it.k]));
  const folder = h("button", { type: "button", class: "btn" }, "Open folder");
  folder.addEventListener("click", openFontFolder);
  const reset = h("button", { type: "button", class: "btn" }, "Reset in-game font");
  reset.addEventListener("click", resetGameFont);

  const wrap = h("div", { class: "fontctl" }, sel, up, reset, del, folder, picker);
  wrap.addEventListener("dragover", e => { e.preventDefault(); wrap.classList.add("drop"); });
  wrap.addEventListener("dragleave", () => wrap.classList.remove("drop"));
  wrap.addEventListener("drop", async e => {
    e.preventDefault();
    wrap.classList.remove("drop");
    const f = e.dataTransfer.files[0];
    if (f) await uploadFont(f);
  });

  syncers.push(() => {
    sel.value = cfg[it.k] || "";
    del.disabled = !cfg[it.k];
    reset.disabled = !cfg[it.k];
  });
  return wrap;
}

const BUILDERS = { toggle: buildToggle, choice: buildChoice, theme: buildTheme, slider: buildSlider, font: buildFont, webfont: buildWebFont };

function buildRow(it) {
  if (it.t === "actions") {
    const r = h("div", { class: "row actions" });
    it.a.forEach(([text, fn]) => {
      const b = h("button", { type: "button", class: "btn" }, text);
      b.addEventListener("click", () => { fn(); change(); });
      r.append(b);
    });
    return r;
  }
  const hint = h("span", { class: "hint" }, it.h || "");
  const control = BUILDERS[it.t](it, hint);
  return h("div", { class: "row" }, h("div", { class: "label" }, h("span", { class: "name" }, it.l), hint), control);
}

function renderTab() {
  syncers.length = 0;
  panel.replaceChildren();
  const tab = TABS.find(t => t.id === current);
  tab.items.forEach(it => panel.append(buildRow(it)));
  panel.setAttribute("aria-labelledby", "tab-" + current);
  tabsEl.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", String(b.dataset.id === current)));
  change();
}

TABS.forEach(t => {
  const b = h("button", { type: "button", class: "tab", role: "tab", id: "tab-" + t.id, "data-id": t.id }, t.name);
  b.addEventListener("click", () => { current = t.id; renderTab(); });
  tabsEl.append(b);
});

function setStatus(state) {
  online = state === "online";
  $("status").dataset.state = state;
  $("statusText").textContent = {
    loading: "Connecting to the mod",
    online: "Connected to the mod",
    offline: "Mod not reachable"
  }[state];
}

async function load() {
  setStatus("loading");
  try {
    const r = await fetch(API, { headers: { Accept: "application/json" } });
    if (!r.ok) throw new Error("HTTP " + r.status);
    cfg = { ...DEFAULTS, ...(await r.json()) };
    setStatus("online");
  } catch (e) {
    cfg = { ...DEFAULTS };
    setStatus("offline");
  }
  saved = JSON.stringify(cfg);
  change();
}

let toastTimer;
function toast(msg, isError = false) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.toggle("error", isError);
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

async function save() {
  if (saveBtn.disabled) return;
  saveBtn.disabled = true;
  try {
    const r = await fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(cfg)
    });
    if (!r.ok) throw new Error("HTTP " + r.status);
    saved = JSON.stringify(cfg);
    toast("Settings saved");
  } catch (e) {
    toast("Couldn’t save. Check that Minecraft is running.", true);
  }
  updateFooter();
}

$("save").addEventListener("click", save);
$("retry").addEventListener("click", load);
$("reset").addEventListener("click", () => {
  cfg = { ...cfg, ...DEFAULTS };
  change();
});
window.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") {
    e.preventDefault();
    save();
  }
});
window.addEventListener("beforeunload", e => {
  if (JSON.stringify(cfg) !== saved) e.preventDefault();
});

renderTab();
load();
loadFonts();
const savedWebFont = storedWebFont();
if (savedWebFont) applyWebFont(savedWebFont, true).then(change);
</script>
</body>
</html>
